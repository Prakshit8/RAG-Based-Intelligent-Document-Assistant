<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Production - Document Q&A System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-brain text-blue-600 text-2xl"></i>
                    <h1 class="text-2xl font-bold text-gray-900">RAG Production</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="status" class="px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-800">
                        <i class="fas fa-circle text-gray-400 text-xs mr-2"></i>Checking...
                    </span>
                    <button id="refreshBtn" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="h-screen p-0">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-0 h-full">
            
            <!-- Left Panel - Upload & Documents -->
            <div class="md:col-span-1 flex flex-col h-full border-r border-gray-200 bg-gray-50">
                
                <!-- Upload Section -->
                <div class="bg-white border-b p-4">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-upload text-blue-600 mr-2"></i>Upload Document
                    </h2>
                    <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors cursor-pointer">
                        <i class="fas fa-file-pdf text-4xl text-gray-400 mb-3"></i>
                        <p class="text-gray-600 mb-2">Drop PDF file here or click to browse</p>
                        <p class="text-sm text-gray-500">Maximum file size: 10MB</p>
                        <input type="file" id="fileInput" accept=".pdf" class="hidden">
                    </div>
                    <div id="uploadProgress" class="hidden mt-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm text-gray-600">Uploading...</span>
                            <span id="progressPercent" class="text-sm text-gray-600">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Documents Section -->
                <div class="bg-white border-b p-4 flex-1 overflow-hidden flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-gray-900">
                            <i class="fas fa-folder text-blue-600 mr-2"></i>Documents
                        </h2>
                        <button id="refreshDocsBtn" class="text-gray-600 hover:text-gray-900">
                            <i class="fas fa-sync-alt text-sm"></i>
                        </button>
                    </div>
                    <div id="documentsList" class="space-y-3 overflow-y-auto flex-1">
                        <p class="text-gray-500 text-sm">No documents uploaded yet</p>
                    </div>
                </div>

                <!-- Stats Section -->
                <div class="bg-white p-4">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-chart-bar text-blue-600 mr-2"></i>Statistics
                    </h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="text-center">
                            <div id="docCount" class="text-2xl font-bold text-blue-600">0</div>
                            <div class="text-sm text-gray-600">Documents</div>
                        </div>
                        <div class="text-center">
                            <div id="chunkCount" class="text-2xl font-bold text-green-600">0</div>
                            <div class="text-sm text-gray-600">Chunks</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Chat Interface -->
            <div class="md:col-span-1 flex flex-col h-full bg-white">
                
                <!-- Chat Header -->
                <div class="border-b px-4 py-3">
                    <h2 class="text-lg font-semibold text-gray-900">
                        <i class="fas fa-comments text-blue-600 mr-2"></i>Ask Questions
                    </h2>
                </div>

                <!-- Chat Messages -->
                <div id="chatMessages" class="flex-1 overflow-y-auto px-4 py-3 space-y-3">
                    <div class="text-center text-gray-500 py-8">
                        <i class="fas fa-robot text-4xl text-gray-300 mb-3"></i>
                        <p>Upload a document and start asking questions!</p>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="border-t px-4 py-3">
                    <div class="flex space-x-3">
                        <input 
                            type="text" 
                            id="questionInput" 
                            placeholder="Ask a question about your documents..."
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            disabled
                        >
                        <button 
                            id="askBtn" 
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-300 disabled:cursor-not-allowed"
                            disabled
                        >
                            <i class="fas fa-paper-plane mr-2"></i>Ask
                        </button>
                    </div>
                    <div class="mt-2 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <label class="text-sm text-gray-600">
                                Max Context Chunks:
                                <select id="maxChunks" class="ml-2 border border-gray-300 rounded px-2 py-1 text-sm">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3" selected>3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </label>
                        </div>
                        <div id="typingIndicator" class="text-sm text-gray-500 hidden">
                            <i class="fas fa-ellipsis-h"></i> AI is thinking...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/static/script.js"></script>
</body>
</html>
